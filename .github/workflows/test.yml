name: Testler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regresyon testleri (motor invariant + senaryolar)
        run: node test-asistan.js
      - name: Sunucu testleri (giriş, oturum süresi, deneme freni, sürüm geçmişi)
        run: node test-sunucu.js
